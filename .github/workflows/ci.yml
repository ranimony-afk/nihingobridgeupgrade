name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-12
      AUTH_TRUST_HOST: "true"
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/unit/*.test.ts
      - run: npx tsc --noEmit
      - run: npx drizzle-kit push --force
      - run: npx --yes tsx --test tests/integration/*.test.ts tests/smoke/*.test.ts tests/e2e/*.test.ts
      - run: npm run build
      - name: Smoke health helper
        run: npx --yes tsx --test tests/smoke/*.test.ts
