name: Flutter

on:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=NB_API_BASE=https://example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-bridge-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
