name: Database Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_DIRECTORY: backups
      BACKUP_RETENTION_DAYS: "30"

    steps:
      - name: Check out operational scripts
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create and verify database backup
        run: ./scripts/backup-database.sh

      - name: Upload verified encrypted-at-rest backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: nihongobridge-postgres-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 30
